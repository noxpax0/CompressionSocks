name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-audit:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: packages.lock.json
      - name: Restore locked dependencies
        run: dotnet restore .\CompressionGarmentOrder.csproj --locked-mode -r win-x64
      - name: Audit dependencies
        run: dotnet list .\CompressionGarmentOrder.csproj package --vulnerable --include-transitive
      - name: Build application
        run: dotnet build .\CompressionGarmentOrder.csproj --configuration Release --no-restore
      - name: Run tests
        run: dotnet run --project .\Mercury.Tests\Mercury.Tests.csproj --configuration Release
      - name: Publish single-file smoke artifact
        run: dotnet publish .\CompressionGarmentOrder.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output .\dist
